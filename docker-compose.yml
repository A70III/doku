# doku — deploy บน home server (M5 · ผ่าน build+run ทดสอบแล้ว · docker มาหลัง M4 นิ่ง docs/08 ข้อ 3)
# ใช้จริง: docker compose up -d --build   · สถานะ: docker compose ps (healthy = /health ตอบ)
# vault อยู่ที่ ./vault บน host (source of truth — แก้/git ได้จาก host ตรง ๆ)
# var (cache/index/revisions/audit) อยู่ใน named volume `doku-var`
services:
  doku:
    build: .
    image: doku:local
    ports:
      - "7667:7667"
    environment:
      DOKU_VAULT: /data/vault
      DOKU_VAR: /data/var
      DOKU_PORT: "7667"
      DOKU_HOST: 0.0.0.0
      # rescan fallback ของ index (ms) — 0 = ปิด พึ่ง watcher อย่างเดียว
      # (sync เร็วขึ้นมากแล้วเพราะ stat-first: ไม่เปลี่ยน = ไม่อ่าน/i/o/hash เลย)
      DOKU_RESCAN_MS: "60000"
    # heap ของ Bun ไม่คืนหน้าให้ OS → RSS ไต่ตาม uptime (วัดจริง 30 วัน: 120MB → ~500MB)
    # cap ไว้ให้ GC ทำงาน + memswap = ห้ามไปกิน swap ของ host (swap 4GB ถูกใช้อยู่แล้ว)
    mem_limit: 768m
    memswap_limit: 768m
    volumes:
      # vault = source of truth (host เห็น/แก้ได้ — "ไฟล์คือความจริง")
      - ./vault:/data/vault
      - doku-var:/data/var
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7667/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  doku-var:
